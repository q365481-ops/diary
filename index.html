
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>日記</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>日記</h1>
  <p>今日のことを書く</p>

  <hr>

  <h2>日記を書く</h2>
  <form id="diary-form">
    <label for="diary-date">日付</label>
    <input type="date" id="diary-date" required>

    <label for="diary-title">タイトル</label>
    <input type="text" id="diary-title" placeholder="今日のタイトル" required>

    <label for="diary-content">本文</label>
    <textarea id="diary-content" rows="6"
      placeholder="今日あったことを書く..." required></textarea>

    <button type="submit">保存する</button>
  </form>

  <hr>

  <h2>最新の日記</h2>
  <ul id="diary-list"></ul>

  <script>
    
<script>
  const list = document.getElementById("diary-list");

  fetch("./diary-list.json")
    .then(response => {
      if (!response.ok) {
        throw new Error("日記一覧を読み込めませんでした");
      }
      return response.json();
    })
    .then(diaryFiles => {
      diaryFiles.forEach(file => {
        const li = document.createElement("li");
        const a = document.createElement("a");

        a.href = file;
        a.textContent = file.replace(".html", "");

        li.appendChild(a);
        list.appendChild(li);
      });
    })
    .catch(error => {
      list.textContent = "日記一覧を読み込めませんでした。";
      console.error(error);
    });
</script>
</body>
</html>
